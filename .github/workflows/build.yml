name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Publish APK to Release (direct download link)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: apk-debug-0x42
        name: Anboud Lock 0x42 (debug APK)
        body: |
          Auto-built debug APK with the "Read Fault Record" (0x42) button.
          Direct download: releases/latest/download/app-debug.apk
        files: app/build/outputs/apk/debug/app-debug.apk
        make_latest: true
